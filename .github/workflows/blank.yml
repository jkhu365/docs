name: Call API Daily

on:
  schedule:
    - cron: '47 8 * * *'  # 每天 UTC 08:47，相当于中国时间 16:47
  workflow_dispatch:     # 可手动触发

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call your API
        run: |
          curl -X GET "https://cmp.conekt.ai/api/v1/ng/schedule/initOperatorRel?id=72"
